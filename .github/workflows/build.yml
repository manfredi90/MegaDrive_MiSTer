# Compile the core with Quartus 17.0 Lite (the image used by MiSTer-unstable-nightlies) and
# keep the .rbf plus the fitter/timing summaries as a downloadable artifact.
name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04   # Yosys 0.33, as used to develop the netlist script
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the Quartus image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Generate the savestate netlist (rtl/md_core_ss.v)
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get update -q && sudo apt-get install -y -q yosys
          yosys -V
          sh savestate/gen_netlist.sh 2>&1 | tee gen.log || { echo "::error title=gen_netlist::$(tail -30 gen.log | awk '{printf "%s%%0A", $0}')"; exit 1; }

      - name: Compile
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -v "$PWD":/build -w /build theypsilon/quartus-lite-c5:17.0.2.docker0 \
            /opt/intelFPGA_lite/quartus/bin/quartus_sh --flow compile MegaDrive.qpf | tee build.log

      # errors, resource use and timing also go to the run page as annotations
      - name: Summary
        if: always()
        shell: bash
        run: |
          grep -E "^Error( \(|:)" build.log | head -20 | sed 's/^/::error::/' || true
          # the rest goes into single multi-line annotations (there is a cap per step)
          echo "::notice title=errors and critical warnings::$(grep -iE "error|critical warning" build.log | grep -v "0 errors" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          echo "::notice title=end of log::$(tail -40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          grep -E "Logic utilization|Total registers|Total block memory bits|Total RAM Blocks|Total DSP" \
            output_files/MegaDrive.fit.summary 2>/dev/null | sed 's/^/::notice::fit: /' || true
          grep -A8 "Slow 1100mV 85C Model Setup Summary" output_files/MegaDrive.sta.rpt 2>/dev/null |
            grep -E "^; [^;]+; -?[0-9]" | sed 's/^/::notice::setup slack: /' || true
          grep -q "Timing requirements not met" output_files/MegaDrive.sta.rpt 2>/dev/null &&
            echo "::warning::Timing requirements not met" || true
          cat output_files/MegaDrive.fit.summary 2>/dev/null || true

      # files laid out as on the SD card: the core, the converter and every layout map
      - name: SD card package
        run: |
          d=sd/Scripts/.megadrive_savestates
          mkdir -p sd/_Console $d/maps
          cp output_files/MegaDrive.rbf sd/_Console/MegaDrive_SS_$(date +%Y%m%d).rbf
          cp savestate/convert/megadrive_savestates.sh sd/Scripts/
          cp savestate/convert/mdss_convert.py $d/
          cp savestate/layouts/*.map.gz $d/maps/
          sed -n "s/.*32'h\(........\);/\1/p" rtl/md_core_ss.vh > $d/maps/current
          echo "layout: $(cat $d/maps/current)"
          git ls-files --error-unmatch savestate/layouts/$(cat $d/maps/current).map.gz > /dev/null 2>&1 ||
            echo "::warning::layout map $(cat $d/maps/current) is not committed: add it to savestate/layouts"

      - uses: actions/upload-artifact@v4
        with:
          name: MegaDrive_SS_sd
          path: sd/
          include-hidden-files: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            output_files/*.summary
            output_files/MegaDrive.sta.rpt
            build.log
