# Compile the core with Quartus 17.0 Lite (the image used by MiSTer-unstable-nightlies) with
# several fitter seeds in parallel: at ~92% of the ALMs the timing result depends on the
# placement. The last job keeps the seed with the best timing as the MegaDrive_SS_sd artifact.
name: build

on:
  push:
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Fitter seeds, as a JSON list'
        required: false
        default: '[1, 2, 3, 4, 5]'

permissions:
  contents: read
  statuses: write   # stage results as commit statuses, readable while the build runs

# a newer push on the same branch makes the running builds useless
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (seed ${{ matrix.seed }})
    runs-on: ubuntu-24.04   # Yosys 0.33, as used to develop the netlist script
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(inputs.seeds || '[1, 2, 3, 4, 5]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Fitter seed
        run: |
          sed -i 's/^set_global_assignment -name SEED .*/set_global_assignment -name SEED ${{ matrix.seed }}/' MegaDrive.qsf
          grep -n "name SEED" MegaDrive.qsf

      - name: Free disk space for the Quartus image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Generate the savestate netlist (rtl/md_core_ss.v)
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get update -q && sudo apt-get install -y -q yosys
          yosys -V
          sh savestate/gen_netlist.sh 2>&1 | tee gen.log || { echo "::error title=gen_netlist::$(tail -30 gen.log | awk '{printf "%s%%0A", $0}')"; exit 1; }

      - name: Status helper
        run: |
          cat > "$RUNNER_TEMP/status.sh" <<'EOS'
          status() { gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context="quartus/seed${{ matrix.seed }}/$1" \
            -f description="$(echo "$2" | cut -c1-139)" > /dev/null || true; }
          EOS
          echo "BASH_ENV=$RUNNER_TEMP/status.sh" >> "$GITHUB_ENV"
          echo "GH_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"

      # Quartus runs in the background; the next steps wait for each stage and put its
      # results on the run page as annotations, so they show up while the build goes on
      - name: Start Quartus
        run: |
          docker run -d --name quartus -v "$PWD":/build -w /build theypsilon/quartus-lite-c5:17.0.2.docker0 \
            sh -c '/opt/intelFPGA_lite/quartus/bin/quartus_sh --flow compile MegaDrive.qpf > build.log 2>&1; echo $? > build.rc'

      - name: Synthesis
        shell: bash
        run: |
          until [ -f output_files/MegaDrive.map.summary ] || [ -f build.rc ]; do sleep 20; done
          sleep 5
          grep -E "Total logic elements|Total registers|Total block memory bits|Total RAM Blocks" \
            output_files/MegaDrive.map.summary 2>/dev/null | sed 's/^/::notice::synthesis: /' || true
          status synthesis "$(grep -E "Logic utilization|Total registers" output_files/MegaDrive.map.summary 2>/dev/null | sed 's/^ *//; s/ *: */ /' | tr '\n' ';')"
          [ ! -f build.rc ] || [ "$(cat build.rc)" = 0 ] || [ -f output_files/MegaDrive.fit.summary ] || exit 1

      - name: Fitter
        shell: bash
        run: |
          until [ -f output_files/MegaDrive.fit.summary ] || [ -f build.rc ]; do sleep 30; done
          sleep 5
          grep -E "Logic utilization|Total registers|Total block memory bits|Total RAM Blocks|Total DSP" \
            output_files/MegaDrive.fit.summary 2>/dev/null | sed 's/^/::notice::fit: /' || true
          status fitter "$(grep -E "Logic utilization|Total registers|Total RAM Blocks" output_files/MegaDrive.fit.summary 2>/dev/null | sed 's/^ *//; s/ *: */ /' | tr '\n' ';')"

      - name: Timing and result
        shell: bash
        run: |
          until [ -f build.rc ]; do sleep 30; done
          # worst slack per clock and corner, in the job log
          cat output_files/MegaDrive.sta.summary 2>/dev/null || true
          grep -E "Worst-case (setup|hold) slack is" build.log | sed 's/^/::notice::/' || true
          grep -q "Timing requirements not met" output_files/MegaDrive.sta.rpt 2>/dev/null &&
            echo "::warning::Timing requirements not met" || true
          status timing "$(grep -oE "Worst-case (setup|hold) slack is -?[0-9.]+" build.log | sed 's/Worst-case //; s/ slack is//' | tr '\n' ' ')"
          # worst setup and hold slack over all clocks, setup TNS summed over all clocks
          setup=$(grep -oE "Worst-case setup slack is -?[0-9.]+" build.log | awk '{print $NF}' | sort -g | head -1)
          hold=$(grep -oE "Worst-case hold slack is -?[0-9.]+" build.log | awk '{print $NF}' | sort -g | head -1)
          tns=$(awk '/^Type/ {s = ($3 == "Setup")} /^TNS/ && s {t += $3} END {printf "%.3f", t}' output_files/MegaDrive.sta.summary)
          mkdir -p timing && echo "${{ matrix.seed }} ${setup:-nan} ${hold:-nan} $tns" > timing/seed${{ matrix.seed }}.txt
          cat timing/seed${{ matrix.seed }}.txt
          exit $(cat build.rc)

      # the worst setup paths (one per endpoint), to see which logic fails timing
      - name: Worst paths
        if: always()
        shell: bash
        run: |
          [ -f output_files/MegaDrive.sta.rpt ] || exit 0
          cat > worst.tcl <<'EOT'
          project_open MegaDrive
          create_timing_netlist
          read_sdc
          update_timing_netlist
          foreach_in_collection p [get_timing_paths -setup -npaths 60 -nworst 1] {
            puts [format "PATH %7.3f %s %s -> %s" [get_path_info $p -slack] \
              [get_clock_info -name [get_path_info $p -to_clock]] \
              [get_node_info -name [get_path_info $p -from]] [get_node_info -name [get_path_info $p -to]]]
          }
          project_close
          EOT
          docker run --rm -v "$PWD":/build -w /build theypsilon/quartus-lite-c5:17.0.2.docker0 \
            /opt/intelFPGA_lite/quartus/bin/quartus_sta -t worst.tcl 2>&1 | grep "^PATH" || true

      # ALMs and registers of the top entities, to see where the area goes
      - name: Area by entity
        if: always()
        shell: bash
        run: |
          awk '/; Fitter Resource Utilization by Entity/ {f = 1}
            f && /Compilation Hierarchy Node/ {print "AREA " substr($0, 1, 300)}
            f && /^; *\|/ {split($0, c, ";"); if (match(c[2], /\|/) <= 9) print "AREA " substr($0, 1, 300)}
            f && /^$/ {if (++e > 1) exit}' output_files/MegaDrive.fit.rpt 2>/dev/null | head -120 || true
          # ALUT/ALM/register breakdown of the whole design
          awk '/^; Fitter Resource Usage Summary/ {f = 1} f {print "RES " $0} f && /^$/ {exit}' \
            output_files/MegaDrive.fit.rpt 2>/dev/null | head -90 || true

      # errors and the end of the log on the run page
      - name: Log
        if: always()
        shell: bash
        run: |
          grep -E "^Error( \(|:)" build.log | head -20 | sed 's/^/::error::/' || true
          echo "::notice title=errors and critical warnings::$(grep -iE "error|critical warning" build.log | grep -v "0 errors" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          echo "::notice title=end of log::$(tail -40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          cat output_files/MegaDrive.fit.summary 2>/dev/null || true

      # files laid out as on the SD card: the core, the converter and every layout map
      - name: SD card package
        run: |
          d=sd/Scripts/.megadrive_savestates
          mkdir -p sd/_Console $d/maps
          cp output_files/MegaDrive.rbf sd/_Console/MegaDrive_SS_$(date +%Y%m%d).rbf
          cp savestate/convert/megadrive_savestates.sh sd/Scripts/
          cp savestate/convert/mdss_convert.py $d/
          cp savestate/layouts/*.map.gz $d/maps/
          sed -n "s/.*32'h\(........\);/\1/p" rtl/md_core_ss.vh > $d/maps/current
          echo "layout: $(cat $d/maps/current)"
          git ls-files --error-unmatch savestate/layouts/$(cat $d/maps/current).map.gz > /dev/null 2>&1 ||
            echo "::warning::layout map $(cat $d/maps/current) is not committed: add it to savestate/layouts"

      # the artifact service fails now and then: one more try after a pause
      - uses: actions/upload-artifact@v4
        id: up1
        continue-on-error: true
        with:
          name: MegaDrive_SS_sd_seed${{ matrix.seed }}
          path: sd/
          include-hidden-files: true
          retention-days: 5

      - if: steps.up1.outcome == 'failure'
        run: sleep 30

      - uses: actions/upload-artifact@v4
        if: steps.up1.outcome == 'failure'
        with:
          name: MegaDrive_SS_sd_seed${{ matrix.seed }}
          path: sd/
          include-hidden-files: true
          retention-days: 5
          overwrite: true

      # uploaded after the package, so that every seed in the pick has one (with one more try too)
      - uses: actions/upload-artifact@v4
        id: up2
        continue-on-error: true
        with:
          name: timing_seed${{ matrix.seed }}
          path: timing/
          retention-days: 5

      - if: steps.up2.outcome == 'failure'
        run: sleep 30

      - uses: actions/upload-artifact@v4
        if: steps.up2.outcome == 'failure'
        with:
          name: timing_seed${{ matrix.seed }}
          path: timing/
          retention-days: 5
          overwrite: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports_seed${{ matrix.seed }}
          path: |
            output_files/*.summary
            output_files/MegaDrive.sta.rpt
            build.log

  # the seed with hold met and the best worst-case setup slack (then the smallest TNS)
  pick:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: timing_seed*
          merge-multiple: true
          path: timing

      - name: Best seed
        id: best
        shell: bash
        run: |
          cat timing/*.txt | sort -n > all.txt
          best=$(awk '$2 != "nan" && $3 != "nan" && $3 >= 0' all.txt | sort -k2,2gr -k4,4gr | head -1 | cut -d' ' -f1)
          [ -n "$best" ] || { echo "::error::no seed with hold timing met"; exit 1; }
          {
            echo "| seed | worst setup | worst hold | setup TNS |"
            echo "|---|---|---|---|"
            awk -v b=$best '{m = ($1 == b) ? " **(kept)**" : ""; print "| " $1 m " | " $2 " | " $3 " | " $4 " |"}' all.txt
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::kept seed $best: $(awk -v b=$best '$1 == b {print "setup " $2 ", hold " $3 ", TNS " $4}' all.txt)"
          echo "seed=$best" >> "$GITHUB_OUTPUT"
          echo "desc=seed $(awk -v b=$best '$1 == b {print $1 ": setup " $2 " hold " $3 " TNS " $4}' all.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: MegaDrive_SS_sd_seed${{ steps.best.outputs.seed }}
          path: sd

      - uses: actions/upload-artifact@v4
        with:
          name: MegaDrive_SS_sd
          path: sd/
          include-hidden-files: true
          overwrite: true   # a re-run of the failed seeds runs the pick again

      - name: Status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context="quartus/best" \
            -f description="${{ steps.best.outputs.desc }}" > /dev/null || true
